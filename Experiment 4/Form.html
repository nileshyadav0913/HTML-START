<!DOCTYPE html> 
<html>
    <head>
        <title>hotel booking form </title>
    </head>
    <body align="center">
        <h1 align="center">hotel booking form </h1>
        <
        <form action="#" method="post">
            <fieldset>
                <legend>Personal detail</legend>
             <label for ="name">Full name :</label>
             <input type="text" id="name" name="Name"required>
             <br><br>
             <lable for="phone">phone number :</lable>
             <input type="tel" id ="phone" name="Phone" required>
             <br><br>
             <lable for="email" >Email</lable>
             <input type="email" id="email" name="email"required>
             <br><br>
             </fieldset>
             <!--booking detail-->
             <fieldset>
                <legend>Bookig detail</legend>
             <label for="checkin">check in date</label>
             <input type="date" id="checkin" name="checkin" required>
             <br><br>
             <label for="checkout">Check out date</label>
             <input type="date" in="check" name="checkout" required>
             <br><br>
             <label for="guests">Number of guests</label>
             <input type="number" id="guests" name="guests" required>
             <br><br>
             <label for="room"></label> Type of room</label>
             <select id="room" name="room"rrequired>
                <option value="single">Single Room</option>
                <option value="double">Double Room </option>
                <option value="suite">suite</option>
                </select>
                <br><br>
                </fieldset>
                <label for="request">additional survice</label>
                <textarea id="request" name="request" rows="4" cols="50" required></textarea>
                <br><br>
                <button type="submit">Book Now</button>
                <br><br>
                <button type="reset">Reset</button>
                <br><br>
                

             
        </form>
    </body>
</html>
